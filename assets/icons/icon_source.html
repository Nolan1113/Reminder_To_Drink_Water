<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8"/>
<style>
body { margin: 0; padding: 0; width: 128px; height: 128px; overflow: hidden; }
svg { display: block; }
</style>
</head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#1e3a5f"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </radialGradient>
    <linearGradient id="dropGrad" x1="30%" y1="10%" x2="70%" y2="90%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- Background circle -->
  <circle cx="64" cy="64" r="60" fill="url(#bgGrad)"/>
  <!-- Water drop shape -->
  <path d="M64 20 C64 20, 38 54, 38 74 C38 89 50 100 64 100 C78 100 90 89 90 74 C90 54 64 20 64 20Z"
        fill="url(#dropGrad)" filter="url(#glow)" opacity="0.95"/>
  <!-- Highlight shine -->
  <ellipse cx="54" cy="56" rx="7" ry="12" fill="white" opacity="0.25" transform="rotate(-20, 54, 56)"/>
  <ellipse cx="51" cy="52" rx="3" ry="5" fill="white" opacity="0.4" transform="rotate(-20, 51, 52)"/>
</svg>
</body>
</html>
